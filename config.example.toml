data_dir = "data"

# Outer silence is trimmed before ASR and the trimmed recording is archived.
# WebRTC uses the optional [vad] extra; without it, energy VAD is used.
[vad]
enabled = true
backend = "webrtc"       # "webrtc", "energy", or "none"
padding_ms = 300           # context kept before/after detected speech
frame_ms = 30              # WebRTC-compatible frame size: 10, 20, or 30
min_speech_ms = 90         # ignore shorter noise bursts
aggressiveness = 2         # WebRTC mode, 0 (lenient) through 3 (aggressive)

[api]
# "groq" (default) or "elevenlabs"
asr_provider = "groq"
groq_base_url = "https://api.groq.com/openai/v1"
groq_model = "whisper-large-v3-turbo"
elevenlabs_base_url = "https://api.elevenlabs.io"
elevenlabs_model = "scribe_v1"
llm_base_url = "https://api.openai.com/v1"
llm_model = "gpt-4o-mini"
timeout = 30
temperature = 0

[processors]
# Base install defaults. Select external adapters only after installing their extras.
itn = "builtin"                  # "builtin" or "wetextprocessing"
terminology = "builtin"          # "builtin" or "mondegreen"
# Required when terminology = "mondegreen"; format is defined by NagaYu/mondegreen.
# terminology_glossary = "config/glossary.csv"

[terminology]
"Kubernetes" = ["クバネティス", "クーベネティス"]
"groq" = ["グロック", "Groq"]
"PNG" = ["png"]
"Base64" = ["base64"]
"JSONL" = ["jsonl", "JSON L", "ジェイソンエル"]
"SQL" = ["sql"]
"SQLite" = ["SQL Lite", "sql lite", "エスキューライト"]
"Whisper" = ["Wisper", "ウィスパー"]
"Todoist" = ["トゥードイスト"]
"React Native" = ["リアクトネイティブ"]
"Codex" = ["コーディクス"]
"Docker" = ["ドッカー"]
"プルリクエスト" = ["プールリクエスト"]
"FXTwitter" = ["FX Twitter"]
"toolproxy" = ["toolproキシ"]
"speech-to-text" = ["speech to text"]
