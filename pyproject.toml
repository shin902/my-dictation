[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-dictation"
version = "0.1.0"
description = "Conservative Japanese dictation pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
my-dictation = "my_dictation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
